name: Deploy to Production (cPanel)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo, gd
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Install NPM & Build Assets
        run: |
          npm ci
          npm run build

      - name: Deploy to cPanel via Rsync & SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          TARGET_PATH: ${{ secrets.REMOTE_TARGET_PATH }}
        run: |
          # 1. Validasi keberadaan Secrets
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$TARGET_PATH" ]; then
            echo "::error::Salah satu Secret (SSH_PRIVATE_KEY, SSH_HOST, SSH_USER, REMOTE_TARGET_PATH) belum terisi atau kosong di GitHub Repository Secrets!"
            exit 1
          fi

          # 2. Setup SSH Key di runner
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 3. Sync file ke cPanel via rsync native
          echo "🚀 Sinkronisasi berkas ke $SSH_USER@$SSH_HOST:$TARGET_PATH..."
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=no" \
            --exclude="/node_modules" \
            --exclude="/.git" \
            --exclude="/.github" \
            --exclude="/tests" \
            --exclude="/.env" \
            --exclude="/storage/app/public/*" \
            --exclude="/storage/logs/*" \
            --exclude="/storage/framework/cache/*" \
            --exclude="/storage/framework/sessions/*" \
            --exclude="/storage/framework/views/*" \
            ./ "$SSH_USER@$SSH_HOST:$TARGET_PATH/"

          # 4. Jalankan perintah pasca-deploy di server cPanel
          echo "🔧 Menjalankan migrasi database dan optimasi cache di server..."
          ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" bash -s -- "$TARGET_PATH" << 'ENDSSH'
            set -e
            APP_DIR="$1"
            cd "$APP_DIR"
            
            # Deteksi binary PHP 8.3 di cPanel (ea-php83 / php)
            PHP_BIN=$(which ea-php83 || which php)
            
            # Pastikan symbolic link storage terpasang
            $PHP_BIN artisan storage:link || true
            
            # Jalankan migrasi database
            $PHP_BIN artisan migrate --force
            
            # Optimasi cache Laravel untuk production
            $PHP_BIN artisan optimize:clear
            $PHP_BIN artisan config:cache
            $PHP_BIN artisan route:cache
            $PHP_BIN artisan view:cache
            $PHP_BIN artisan icons:cache
            
            echo "✅ Deployment sukses dan aplikasi aktif!"
          ENDSSH
