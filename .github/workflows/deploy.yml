name: Deploy to Production (cPanel)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo, gd
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Install NPM & Build Assets
        run: |
          npm ci
          npm run build

      - name: Deploy to cPanel via SSH Stream
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST || '141.11.190.2' }}
          SSH_USER: ${{ secrets.SSH_USER || 'desaadat' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          TARGET_PATH: ${{ secrets.REMOTE_TARGET_PATH || '/home/desaadat/sptak-tamanbali' }}
        run: |
          # 1. Validasi keberadaan Secret
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Secret SSH_PRIVATE_KEY tidak ditemukan di Repository Secrets!"
            exit 1
          fi

          # 2. Setup SSH Key di runner
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 3. Pack dan streaming file terkompresi langsung via SSH ke cPanel (tanpa rsync)
          echo "🚀 Mengunggah dan mengekstrak berkas aplikasi ke $SSH_USER@$SSH_HOST:$TARGET_PATH..."
          
          # Buat direktori target di server jika belum ada
          ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "mkdir -p $TARGET_PATH"

          # Stream tar.gz langsung ke server
          tar -czf - \
            --exclude='./node_modules' \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./tests' \
            --exclude='./.env' \
            --exclude='./storage/app/public/*' \
            --exclude='./storage/logs/*' \
            --exclude='./storage/framework/cache/*' \
            --exclude='./storage/framework/sessions/*' \
            --exclude='./storage/framework/views/*' \
            . | ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "tar -xzf - -C $TARGET_PATH"

          # 4. Jalankan migrasi dan optimasi cache Laravel di server cPanel
          echo "🔧 Menjalankan migrasi database dan optimasi cache di server..."
          ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" bash -s -- "$TARGET_PATH" << 'ENDSSH'
            set -e
            APP_DIR="$1"
            cd "$APP_DIR"
            
            # Deteksi binary PHP 8.3 di cPanel (ea-php83 / php)
            PHP_BIN=$(which ea-php83 || which php)
            
            # Pastikan folder permission dan symbolic link storage terpasang
            chmod -R 775 storage bootstrap/cache || true
            $PHP_BIN artisan storage:link || true
            
            # Jalankan migrasi database
            $PHP_BIN artisan migrate --force
            
            # Jalankan seeder master awal jika belum pernah di-seed
            $PHP_BIN artisan db:seed --class=ProductionSeeder --force || true
            
            # Optimasi cache Laravel untuk production
            $PHP_BIN artisan optimize:clear
            $PHP_BIN artisan config:cache
            $PHP_BIN artisan route:cache
            $PHP_BIN artisan view:cache
            $PHP_BIN artisan icons:cache
            
            echo "✅ Deployment sukses dan aplikasi aktif di production!"
          ENDSSH
