name: Deploy to Production (cPanel)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo, gd
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Install NPM & Build Assets
        run: |
          npm ci
          npm run build

      - name: Sync Files to cPanel via SSH
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT || 22 }}
          TARGET: ${{ secrets.REMOTE_TARGET_PATH }}
          EXCLUDES: '/node_modules/, /.git/, /.github/, /tests/, .env'

      - name: Execute Post-Deployment Commands on cPanel
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.REMOTE_TARGET_PATH }}
            
            # Deteksi binary PHP 8.3 di cPanel (ea-php83 / php)
            PHP_BIN=$(which ea-php83 || which php)
            
            # Pastikan symbolic link storage terpasang
            $PHP_BIN artisan storage:link || true
            
            # Jalankan migrasi database
            $PHP_BIN artisan migrate --force
            
            # Optimasi cache Laravel untuk production
            $PHP_BIN artisan optimize:clear
            $PHP_BIN artisan config:cache
            $PHP_BIN artisan route:cache
            $PHP_BIN artisan view:cache
            $PHP_BIN artisan icons:cache
